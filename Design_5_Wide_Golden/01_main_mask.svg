<text x="38" y="249.6" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >CUT  — solid black line</text>
<line x1="14" y1="254.1" x2="34" y2="254.1" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8"/>
<text x="38" y="255.2" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >FOLD  — dashed grey line</text>
<line x1="14" y1="259.7" x2="34" y2="259.7" fill="none" stroke="#1d5fe0" stroke-width="0.7" stroke-dasharray="0.1 1.4" stroke-linecap="round"/>
<text x="38" y="260.8" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >GLUE / placement guide — dotted blue line</text>
<line x1="14" y1="265.3" x2="34" y2="265.3" fill="none" stroke="#bdbdbd" stroke-width="0.3"/>
<text x="38" y="266.4" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >PLACEMENT — thin light grey line</text>
<text x="14" y="273.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >Print at 100% (Actual Size). Never use “Fit to page”.</text>
<text x="14" y="278.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >Cut this paper template, trace it on 200–300 GSM kraft/card,</text>
<text x="14" y="283.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >then cut the card piece.</text>
</g>
