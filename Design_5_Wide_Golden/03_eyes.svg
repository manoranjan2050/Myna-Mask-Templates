<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Myna Mask – 03 Eyes</title>
<desc>A4 template for eye pieces. Print at 100%.</desc>
<rect x="0" y="0" width="210" height="297" fill="#ffffff"/>
<text x="10" y="14.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="6.2" text-anchor="start" font-weight="bold" fill="#000" >EYES — आँखें</text>
<text x="10" y="21" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="normal" fill="#333" >Print at 100% / Actual Size   ·   Design 5: Wide &amp; Golden</text>
<text x="200" y="14.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="end" font-weight="normal" fill="#666" >Page 3 of 6</text>
<text x="200" y="21" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="end" font-weight="normal" fill="#666" >Black + yellow + white paper</text>
<text x="10" y="30" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="bold" fill="#000" >1  EYE OUTER SHAPES — Black paper (cut 1 left + 1 right)</text>
