<text x="10" y="90" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="bold" fill="#000" >2  YELLOW EYE RINGS — Yellow paper (cut 1 left + 1 right)</text>
