</g>
<g id="notes">
<text x="10" y="182" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.4" text-anchor="start" font-weight="bold" fill="#000" >SIZE &amp; NOTES</text>
<text x="10" y="188" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Face: 150 × 134 mm (about the size of a 7–10 year-old’s face). Beak sticks out 25–30 mm.</text>
<text x="10" y="193" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Eye openings: 26 × 22 mm, centres 56 mm apart. Hold up to the child’s face to check.</text>
<text x="10" y="198" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Side holes: Ø6 mm – use a hole punch (on the card piece), then thread elastic / string.</text>
<text x="10" y="203" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Dashed centre creases are optional: crease gently so the mask curves round the face.</text>
<text x="10" y="208" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Blue dotted boxes = where the beak glue tabs go.  Light grey outlines = where eye shapes and</text>
<text x="10" y="213" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >feathers go.  H = head feathers   S = large side feathers   W = wing piece   C = chin scales</text>
<text x="10" y="218" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >(these pieces are on pages 3 and 4).  Left and right sides are mirror images.</text>
</g>
<g id="legend">
<rect x="10" y="238" width="132" height="50" rx="2" fill="none" stroke="#bbb" stroke-width="0.3"/>
<text x="14" y="243.2" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="bold" fill="#000" >LEGEND</text>
