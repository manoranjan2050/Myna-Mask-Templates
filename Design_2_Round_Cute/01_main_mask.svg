<text x="105" y="124.4" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#1d5fe0" >B  lower beak tab</text>
