<text x="175" y="268" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.7" text-anchor="middle" font-weight="normal" fill="#444" >Each side must measure</text>
<text x="175" y="272" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.7" text-anchor="middle" font-weight="normal" fill="#444" >exactly 50 mm with a ruler.</text>
