<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="210mm" height="297mm" viewBox="0 0 210 297">
<title>Myna Mask – 04 Feathers</title>
<desc>A4 template for decorative feathers. Print at 100%.</desc>
<rect x="0" y="0" width="210" height="297" fill="#ffffff"/>
<text x="10" y="14.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="6.2" text-anchor="start" font-weight="bold" fill="#000" >FEATHERS — पंख</text>
<text x="10" y="21" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="normal" fill="#333" >Print at 100% / Actual Size   ·   Design 4: Simple &amp; Easy</text>
<text x="200" y="14.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="end" font-weight="normal" fill="#666" >Page 4 of 6</text>
<text x="200" y="21" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="end" font-weight="normal" fill="#666" >Left + right are mirror images</text>
<text x="10" y="30" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="bold" fill="#000" >A  LARGE SIDE FEATHERS — brown card (2 big + 2 medium)</text>
<g class="piece" id="f1" transform="translate(30 86) rotate(0)"><path d="M0,0 C13.3,-6.24 17.4,-31.2 9.68,-49.4 Q7.72,-54.6 2.96,-49.4 C-12.36,-31.2 -13.1,-6.24 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M0.07,-5.2 Q0.56,-23.4 4.48,-41.6" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="30" y="92" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >L</text>
<g class="piece" id="f2" transform="translate(70 86) rotate(0)"><path d="M0,0 C11.09,-5.28 14.56,-26.4 8.21,-41.8 Q6.62,-46.2 2.61,-41.8 C-10.24,-26.4 -10.91,-5.28 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M0.06,-4.4 Q0.48,-19.8 3.84,-35.2" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="70" y="92" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >L</text>
<g class="piece" id="f3" transform="translate(140 86) rotate(0)"><path d="M0,0 C10.91,-5.28 10.24,-26.4 -2.61,-41.8 Q-6.62,-46.2 -8.21,-41.8 C-14.56,-26.4 -11.09,-5.28 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M-0.06,-4.4 Q-0.48,-19.8 -3.84,-35.2" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="140" y="92" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >R</text>
<g class="piece" id="f4" transform="translate(180 86) rotate(0)"><path d="M0,0 C13.1,-6.24 12.36,-31.2 -2.96,-49.4 Q-7.72,-54.6 -9.68,-49.4 C-17.4,-31.2 -13.3,-6.24 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M-0.07,-5.2 Q-0.56,-23.4 -4.48,-41.6" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="180" y="92" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >R</text>
<text x="105" y="62" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#888" >mirrored pairs</text>
<text x="105" y="66" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#888" >← LEFT      RIGHT →</text>
<text x="10" y="97" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="bold" fill="#000" >B  SMALL HEAD FEATHERS — dark brown / black card (2 + 2)</text>
<g class="piece" id="f5" transform="translate(22 136) rotate(0)"><path d="M0,0 C7.19,-3.12 9.14,-15.6 4.53,-24.7 Q3.31,-27.3 0.89,-24.7 C-6.98,-15.6 -7.11,-3.12 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M0.03,-2.6 Q0.24,-11.7 1.92,-20.8" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="22" y="142" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >L</text>
<g class="piece" id="f6" transform="translate(188 136) rotate(0)"><path d="M0,0 C7.11,-3.12 6.98,-15.6 -0.89,-24.7 Q-3.31,-27.3 -4.53,-24.7 C-9.14,-15.6 -7.19,-3.12 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M-0.03,-2.6 Q-0.24,-11.7 -1.92,-20.8" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="188" y="142" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >R</text>
<g class="piece" id="f7" transform="translate(46 136) rotate(0)"><path d="M0,0 C7.19,-3.12 9.14,-15.6 4.53,-24.7 Q3.31,-27.3 0.89,-24.7 C-6.98,-15.6 -7.11,-3.12 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M0.03,-2.6 Q0.24,-11.7 1.92,-20.8" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="46" y="142" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >L</text>
<g class="piece" id="f8" transform="translate(164 136) rotate(0)"><path d="M0,0 C7.11,-3.12 6.98,-15.6 -0.89,-24.7 Q-3.31,-27.3 -4.53,-24.7 C-9.14,-15.6 -7.19,-3.12 0,0 Z" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" /><path d="M-0.03,-2.6 Q-0.24,-11.7 -1.92,-20.8" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8" /></g>
<text x="164" y="142" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="middle" font-weight="bold" fill="#555" >R</text>
<text x="10" y="150" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="start" font-weight="bold" fill="#000" >SIMPLE DESIGN — only 3 kinds of piece, no wings or scales to cut.</text>
<text x="10" y="158" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#222" >Glue the big side feathers first, then the head feathers on top. Easy for ages 6–8!</text>
<g id="legend">
<rect x="10" y="238" width="132" height="50" rx="2" fill="none" stroke="#bbb" stroke-width="0.3"/>
<text x="14" y="243.2" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="bold" fill="#000" >LEGEND</text>
<line x1="14" y1="248.5" x2="34" y2="248.5" fill="none" stroke="#000" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="38" y="249.6" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >CUT  — solid black line</text>
<line x1="14" y1="254.1" x2="34" y2="254.1" fill="none" stroke="#808080" stroke-width="0.5" stroke-dasharray="3 1.8"/>
<text x="38" y="255.2" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >FOLD  — dashed grey line</text>
<line x1="14" y1="259.7" x2="34" y2="259.7" fill="none" stroke="#1d5fe0" stroke-width="0.7" stroke-dasharray="0.1 1.4" stroke-linecap="round"/>
<text x="38" y="260.8" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >GLUE / placement guide — dotted blue line</text>
<line x1="14" y1="265.3" x2="34" y2="265.3" fill="none" stroke="#bdbdbd" stroke-width="0.3"/>
<text x="38" y="266.4" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.2" text-anchor="start" font-weight="normal" fill="#000" >PLACEMENT — thin light grey line</text>
<text x="14" y="273.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >Print at 100% (Actual Size). Never use “Fit to page”.</text>
<text x="14" y="278.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >Cut this paper template, trace it on 200–300 GSM kraft/card,</text>
<text x="14" y="283.5" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3" text-anchor="start" font-weight="normal" fill="#333" >then cut the card piece.</text>
</g>
<g id="scale-check">
<rect x="150" y="238" width="50" height="50" fill="none" stroke="#000" stroke-width="0.5"/>
<line x1="160" y1="238" x2="160" y2="240.5" stroke="#000" stroke-width="0.3"/>
<line x1="150" y1="248" x2="152.5" y2="248" stroke="#000" stroke-width="0.3"/>
<line x1="170" y1="238" x2="170" y2="240.5" stroke="#000" stroke-width="0.3"/>
<line x1="150" y1="258" x2="152.5" y2="258" stroke="#000" stroke-width="0.3"/>
<line x1="180" y1="238" x2="180" y2="240.5" stroke="#000" stroke-width="0.3"/>
<line x1="150" y1="268" x2="152.5" y2="268" stroke="#000" stroke-width="0.3"/>
<line x1="190" y1="238" x2="190" y2="240.5" stroke="#000" stroke-width="0.3"/>
<line x1="150" y1="278" x2="152.5" y2="278" stroke="#000" stroke-width="0.3"/>
<text x="175" y="262" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="3.6" text-anchor="middle" font-weight="bold" fill="#000" >50 mm SCALE CHECK</text>
<text x="175" y="268" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.7" text-anchor="middle" font-weight="normal" fill="#444" >Each side must measure</text>
<text x="175" y="272" font-family="Arial, 'Nirmala UI', 'Noto Sans Devanagari', Mangal, sans-serif" font-size="2.7" text-anchor="middle" font-weight="normal" fill="#444" >exactly 50 mm with a ruler.</text>
</g>
</svg>